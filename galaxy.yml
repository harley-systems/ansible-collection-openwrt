  - letsencrypt
  - firewall
  - wifi
  - ddns
  - networking
dependencies: {}
repository: https://github.com/harley-systems/ansible-collection-openwrt
documentation: https://github.com/harley-systems/ansible-collection-openwrt
homepage: https://github.com/harley-systems/ansible-collection-openwrt
issues: https://github.com/harley-systems/ansible-collection-openwrt/issues
build_ignore:
  - .git
  - .gitignore
  - '*.tar.gz'
