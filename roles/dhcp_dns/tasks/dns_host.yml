---
# Configure a DNS A record (domain entry)

- name: "Ensure DNS host section exists: {{ host.name }}"
  harley.openwrt.uci:
    p: dhcp
    s: "{{ host.name }}_domain"
    type: domain
  notify: restart dnsmasq

- name: "Configure DNS host name: {{ host.name }}"
  harley.openwrt.uci:
    p: dhcp
    s: "{{ host.name }}_domain"
    name: name
    val: "{{ host.name }}"
  notify: restart dnsmasq

- name: "Configure DNS host IP: {{ host.name }}"
  harley.openwrt.uci:
    p: dhcp
    s: "{{ host.name }}_domain"
    name: ip
    val: "{{ host.ip }}"
  notify: restart dnsmasq
