---
# Base role - Initial OpenWRT setup for Ansible management

- name: Detect connection type and set facts
  ansible.builtin.include_tasks: detect_connection.yml
  tags: [base, detect_connection]

- name: Update package lists
  ansible.builtin.include_tasks: update_packages.yml
  tags: [base, update_packages]
  when: base_update_packages | bool

- name: Install Python3
  ansible.builtin.include_tasks: install_python3.yml
  tags: [base, install_python3]
  when: base_install_python | bool

- name: Install pip3
  ansible.builtin.include_tasks: install_pip3.yml
  tags: [base, install_pip3]
  when: base_install_pip | bool

- name: Install SFTP server
  ansible.builtin.include_tasks: install_sftp.yml
  tags: [base, install_sftp]
  when: base_install_sftp | bool

- name: Install user management tools
  ansible.builtin.include_tasks: install_user_management.yml
  tags: [base, install_user_management]
  when: base_install_sudo | bool

- name: Create ansible user
  ansible.builtin.include_tasks: create_ansible_user.yml
  tags: [base, create_ansible_user]
