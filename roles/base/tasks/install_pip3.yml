---
# Install pip3 and virtualenv

- name: Install python3-pip
  community.general.opkg:
    name: python3-pip
    state: present

- name: Upgrade pip to latest version
  ansible.builtin.pip:
    name: pip
    extra_args: --upgrade

- name: Install virtualenv
  ansible.builtin.pip:
    name: virtualenv
    state: present
