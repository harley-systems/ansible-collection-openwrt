---
# ACME role - Let's Encrypt certificates with DNS-01 validation

- name: Install ACME packages
  community.general.opkg:
    name: "{{ item }}"
    state: present
  loop:
    - acme
    - acme-acmesh-dnsapi
    - luci-app-acme
  tags: [acme, acme_packages]

- name: Create ACME configuration directory
  ansible.builtin.file:
    path: /etc/acme
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [acme, acme_config]

- name: Deploy DNS provider credentials
  ansible.builtin.template:
    src: credentials.env.j2
    dest: /etc/acme/credentials.env
    owner: root
    group: root
    mode: "0600"
  notify: restart acme
  tags: [acme, acme_credentials]

- name: Deploy ACME configuration
  ansible.builtin.template:
    src: acme.j2
    dest: /etc/config/acme
    owner: root
    group: root
    mode: "0600"
  notify: restart acme
  tags: [acme, acme_config]

- name: Save credentials to ACME account.conf (Cloudflare)
  # regexp is required: without it, rotating a credential appends a second
  # SAVED_CF_Token line instead of replacing the existing one.
  ansible.builtin.lineinfile:
    path: /etc/acme/account.conf
    regexp: "^{{ item.key }}="
    line: '{{ item.key }}="{{ item.value }}"'
    create: true
    owner: root
    group: root
    mode: "0600"
  loop:
    - {key: SAVED_CF_Token, value: "{{ acme_cf_token }}"}
    - {key: SAVED_CF_Zone_ID, value: "{{ acme_cf_zone_id }}"}
  loop_control:
    label: "{{ item.key }}"
  when: acme_dns_provider == 'dns_cf'
  no_log: true
  notify: restart acme
  tags: [acme, acme_credentials]

# acme.sh sources the per-domain config at the start of renew(), which injects
# the stored CF_Token into the environment. dns_cf.sh then resolves
#   CF_Token="${CF_Token:-$(_readaccountconf_mutable CF_Token)}"
# so the already-set value from this file WINS over account.conf. If it is not
# updated as well, rotating the token anywhere else is a silent no-op and every
# renewal keeps failing with the old credential.
- name: Check for existing per-domain acme.sh config
  ansible.builtin.stat:
    path: "{{ acme_cert_dir }}/{{ acme_domain }}.conf"
  register: acme_domain_conf
  tags: [acme, acme_credentials]

- name: Update DNS credentials in per-domain acme.sh config (Cloudflare)
  ansible.builtin.lineinfile:
    path: "{{ acme_cert_dir }}/{{ acme_domain }}.conf"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}='{{ item.value }}'"
  loop:
    - {key: CF_Token, value: "{{ acme_cf_token }}"}
    - {key: CF_Zone_ID, value: "{{ acme_cf_zone_id }}"}
  loop_control:
    label: "{{ item.key }}"
  when:
    - acme_dns_provider == 'dns_cf'
    - acme_domain_conf.stat.exists
  no_log: true
  notify: restart acme
  tags: [acme, acme_credentials]

- name: Enable and start ACME service
  community.general.openwrt_init:
    name: acme
    state: started
    enabled: true
  tags: [acme, acme_service]

- name: Configure uhttpd to use ACME certificate
  harley.openwrt.uci:
    p: uhttpd
    s: main
    name: cert
    val: "{{ acme_cert_dir }}/fullchain.cer"
  when: acme_configure_uhttpd | bool
  notify: restart uhttpd
  tags: [acme, acme_uhttpd]

- name: Configure uhttpd to use ACME key
  harley.openwrt.uci:
    p: uhttpd
    s: main
    name: key
    val: "{{ acme_cert_dir }}/{{ acme_domain }}.key"
  when: acme_configure_uhttpd | bool
  notify: restart uhttpd
  tags: [acme, acme_uhttpd]
